<!doctype html>
<!-- overflow: hidden até o loader terminar (o SiteLoader libera); assim a primeira
     tela já tem a mesma largura que o loader vai usar, sem barra de rolagem. -->

  <head>
    <meta charset="UTF-8" />

    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Resilience · Gestão de redes sociais" />

    <!-- TODO(perf): trocar por woff2 servidos localmente -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <!-- Um link por família: com as duas no mesmo link, o Fontshare devolve só a primeira. -->
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&display=swap" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500&display=swap" />
    <!-- Loader estático: aparece no primeiro desenho da página, antes do JavaScript,
         idêntico ao estado inicial do SiteLoader (fundo azul + símbolo vazio no centro,
         437 px em 1440). O SiteLoader remove este elemento quando começa a encher. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #3d3bf3;
      }
      #boot svg {
        width: clamp(150px, calc(100vw * 436 / 1440), 436px);
        height: auto;
        fill: #f4f4fa;
        fill-opacity: 0.16;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot { display: none; }
      }
    </style>
    <noscript><style>#boot { display: none; } html { overflow: auto !important; }</style></noscript>
  </head>
